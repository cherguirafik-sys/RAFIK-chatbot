<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Flowyne · C · Typo cinétique</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--t:#00D1C1;--n:#052028}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--t);font-family:Geist,system-ui,sans-serif;color:var(--n)}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--t)}
.row{position:absolute;left:0;white-space:nowrap;font-weight:900;letter-spacing:-.05em;line-height:1}
.r1{top:-30px;font-size:190px;transform:translateX(-260px)}
.r3{top:860px;font-size:190px;transform:translateX(-640px)}
.o{color:transparent;-webkit-text-stroke:3px var(--n)}
.s{color:var(--n)}
.sep{display:inline-block;width:40px;height:40px;border-radius:50%;background:var(--n);margin:0 46px;vertical-align:middle;position:relative;top:-24px}
.mid{position:absolute;left:0;right:0;top:170px;height:690px;background:var(--n);color:#fff;display:flex;align-items:center;padding:0 130px;gap:80px}
.big{font-size:500px;font-weight:900;letter-spacing:-.07em;line-height:.8;color:var(--t)}
.big sup{font-size:220px;letter-spacing:-.04em;vertical-align:top;position:relative;top:20px}
.txt{font-size:96px;flex:1;font-weight:800;letter-spacing:-.035em;line-height:1.02}
.txt span{display:block;color:#8ba4ac;font-weight:600;font-size:40px;letter-spacing:-.01em;margin-top:34px;line-height:1.3}
.mark{position:absolute;right:120px;bottom:60px;height:56px}
</style></head><body><div class="stage">
<div class="row r1"><span class="s">Coiffeur</span><i class="sep"></i><span class="o">Barbier</span><i class="sep"></i><span class="s">Institut</span><i class="sep"></i><span class="o">Massage</span></div>
<div class="mid">
 <div class="big">0<sup>%</sup></div>
 <div class="txt">de commission.<br>Sur chaque<br>rendez-vous.<span>29,99 € par mois, tout inclus.<br>1 mois offert, sans carte bancaire.</span></div>
 <img class="mark" src="logo-white.png" alt="Flowyne">
</div>
<div class="row r3"><span class="o">Ongles</span><i class="sep"></i><span class="s">Coach sportif</span><i class="sep"></i><span class="o">Tatoueur</span><i class="sep"></i><span class="s">Naturopathe</span></div>
</div></body></html>
