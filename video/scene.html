<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Survol Rafik</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0b0b18; }
  #stage { position: relative; overflow: hidden; }
  #world { position: absolute; transform-origin: 0 0; will-change: transform; }
  #site { border: 0; display: block; border-radius: 28px; box-shadow: 0 40px 120px rgba(0,0,0,.55); }
  #captions { position: absolute; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  .caption {
    font-family: "Liberation Sans", Arial, sans-serif; font-weight: 700; color: #fff;
    background: rgba(26,26,46,.82); border: 2px solid rgba(255,255,255,.18);
    padding: 16px 30px; border-radius: 999px; letter-spacing: .2px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="world"><iframe id="site" scrolling="no"></iframe></div>
  <div id="captions"></div>
</div>
<script src="config.js"></script>
<script src="scene.js"></script>
</body>
</html>
